<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>POC Vialidad recalibrada</title>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: white; padding: 10px 14px; border-radius: 6px;
    font-family: sans-serif; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="panel">
  <div><b>Vialidad recalibrada</b></div>
  <label>Opacidad: <input id="op" type="range" min="0" max="1" step="0.05" value="0.75"></label>
</div>
<div id="map"></div>
<script>
fetch('vialidad_corners.json').then(r=>r.json()).then(corners => {
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: { osm: { type: 'raster', tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'], tileSize: 256 } },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
    },
    center: [-70.5357619, -33.3945349],
    zoom: 15
  });
  window.map = map;

  (async () => {
    const start = Date.now();
    while (Date.now()-start < 6000) {
      try { map.getStyle(); if (map.style && map.style._loaded && map.isStyleLoaded()) break; } catch(e){}
      await new Promise(r=>setTimeout(r,200));
    }
    for (let attempt=0; attempt<20; attempt++) {
      try {
        map.addSource('overlay', { type: 'image', url: 'vialidad_overlay.png', coordinates: [corners.TL, corners.TR, corners.BR, corners.BL] });
        break;
      } catch(e) { await new Promise(r=>setTimeout(r,300)); }
    }
    map.addLayer({ id: 'overlay-layer', type: 'raster', source: 'overlay', paint: { 'raster-opacity': 0.75 } });
  })();

  document.getElementById('op').addEventListener('input', (e) => {
    map.setPaintProperty('overlay-layer', 'raster-opacity', parseFloat(e.target.value));
  });
});
</script>
</body>
</html>
