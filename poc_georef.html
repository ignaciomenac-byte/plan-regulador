<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>POC Georreferenciación - Uso de Suelo Las Condes</title>
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
<style>
  html, body, #map { height: 100%; margin: 0; }
  #panel {
    position: absolute; top: 10px; left: 10px; z-index: 1;
    background: white; padding: 10px 14px; border-radius: 6px;
    font-family: sans-serif; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
</style>
</head>
<body>
<div id="panel">
  <div><b>POC: Lámina Uso de Suelo georreferenciada</b></div>
  <label>Opacidad overlay: <input id="op" type="range" min="0" max="1" step="0.05" value="0.75"></label>
</div>
<div id="map"></div>
<script>
fetch('corners.json').then(r=>r.json()).then(corners => {
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        osm: {
          type: 'raster',
          tiles: ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
          tileSize: 256,
          attribution: '© OpenStreetMap contributors'
        }
      },
      layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
    },
    center: [-70.55, -33.40],
    zoom: 12
  });
  window.map = map;
  map.on('error', (e) => console.error('MAPLIBRE ERROR', e.error && e.error.message, e));

  map.on('load', () => {
    map.addSource('overlay', {
      type: 'image',
      url: 'uso_suelo_overlay.png',
      coordinates: [corners.TL, corners.TR, corners.BR, corners.BL]
    });
    map.addLayer({
      id: 'overlay-layer',
      type: 'raster',
      source: 'overlay',
      paint: { 'raster-opacity': 0.75 }
    });

    const bounds = new maplibregl.LngLatBounds();
    Object.values(corners).forEach(c => bounds.extend(c));
    map.fitBounds(bounds, { padding: 20 });
  });

  document.getElementById('op').addEventListener('input', (e) => {
    map.setPaintProperty('overlay-layer', 'raster-opacity', parseFloat(e.target.value));
  });
});
</script>
</body>
</html>
